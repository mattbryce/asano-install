services:
  # Applies database migrations and seeds the first admin, then exits. Asano
  # waits for it to finish successfully, so a failed migration stops the app
  # starting rather than letting it run against a half-applied schema.
  migrate:
    image: ghcr.io/mattbryce/asano-migrate:latest
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      # Falls back to the bundled db, but a DATABASE_URL set in .env wins. This
      # used to be an unconditional override, so a customer pointing at their
      # own database was silently ignored and the only documented way out was
      # editing this file — which then conflicts on every upgrade.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/asano}
      # Migrations need a direct connection: prisma migrate deploy takes an
      # advisory lock and uses prepared statements, and a transaction-mode
      # pooler (PgBouncer, RDS Proxy, Supabase's pooler) breaks both — it does
      # not error, it hangs. Set this when DATABASE_URL is pooled.
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

  asano:
    image: ghcr.io/mattbryce/asano:latest
    restart: unless-stopped
    ports:
      # Bound to localhost only — Next.js isn't meant to face the internet
      # directly, no TLS of its own and nothing rate-limiting it. The caddy
      # service below is the actual public entry point (80/443); this stays
      # reachable as localhost:3000 from the host itself as a bypass — handy
      # for a quick local eval, or for troubleshooting if Caddy itself is the
      # problem.
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # As above: bundled db by default, overridden by .env when set.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/asano}
      # pg_dump (lib/backup.ts — Settings → Backup, and scheduled dumps)
      # prefers this over DATABASE_URL when set, same pooler-incompatibility
      # reason as the migrate service above.
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
    volumes:
      # Bind mount, not a named volume — scheduled dumps (Settings → Backup)
      # land here, and an operator needs to actually reach the files on their
      # host to copy them elsewhere. See .env.example for a permissions note:
      # this directory needs to be writable by the container's uid 1001
      # before first bringing the stack up.
      - ${BACKUP_PATH:-./backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asano
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The public entry point. Reverse-proxies to asano over the compose
  # network (not localhost:3000 — that binding above is host-only, this
  # container reaches it as `asano` regardless). SITE_ADDRESS unset means
  # "listen on :80 plain HTTP, no domain" — nothing to configure for a local
  # eval; set it in .env to your real domain and Caddy requests and renews a
  # real certificate for it automatically, no separate step.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      # Not `environment: SITE_ADDRESS: ${SITE_ADDRESS:-}` — Compose would
      # set the container's env var to an explicit empty string when unset
      # on the host, and Caddy's own `{$SITE_ADDRESS::80}` default below
      # only applies when the variable is genuinely absent, not merely
      # empty. env_file leaves it unset entirely unless .env sets it.
      - path: .env
        required: false
    configs:
      # Inline rather than a bind-mounted ./Caddyfile — a customer who
      # curled only this compose file (an easy thing to do; it used to be
      # the whole install) would otherwise hit a genuinely bad failure:
      # Docker silently creates an empty *directory* named Caddyfile at the
      # missing bind-mount source, the container fails to start with an
      # opaque "not a directory" mount error, and that stray directory then
      # blocks even placing a real file there afterward. Confirmed by
      # reproducing it. This can't happen with a config baked into the one
      # file that's always present.
      #
      # $$ (not $) is deliberate: Compose interpolates $VAR/${VAR} in every
      # string in this file, including inside this block — a single $ here
      # would make Compose consume SITE_ADDRESS itself before Caddy ever
      # saw it, rather than passing the placeholder through. $$ is Compose's
      # own escape for a literal $, so the config as delivered to the
      # container keeps Caddy's native {$SITE_ADDRESS::80} syntax intact.
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - asano

configs:
  caddyfile:
    content: |
      {$$SITE_ADDRESS::80} {
      	reverse_proxy asano:3000
      }

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
